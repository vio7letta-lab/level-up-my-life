<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Level Up: My Life</title>
    <meta name="description" content="RPG моей реальной жизни: реальные действия → игровой прогресс → реальный результат." />

    <!-- Тема применяется до загрузки React, чтобы не было вспышки светлого фона -->
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('lumyl:prefs') || '{}')
        if (p.theme === 'light') document.documentElement.dataset.theme = 'light'
      } catch (e) {}
    </script>

    <!-- iPhone: «На экран Домой» -->
    <meta name="theme-color" content="#0c0b0f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Level Up" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
